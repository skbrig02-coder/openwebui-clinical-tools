name: deterministic-tests

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline suites
        run: |
          python3 - << 'PY'
          import asyncio
          import verify_all_tools
          import verify_stage_queue

          asyncio.run(verify_all_tools.run_deterministic_tests())
          verify_stage_queue.run_stage_queue_tests()
          PY
